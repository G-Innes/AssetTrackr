name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assettrackr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway credentials for the service container above
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/assettrackr_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      # Runs the built API and client against a second, empty database
      - name: End-to-end tests
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres assettrackr_e2e
          npm run test:e2e
        env:
          E2E_START_SERVERS: '1'
          NODE_ENV: production
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/assettrackr_e2e
          DATABASE_SSL: 'false'
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          CLIENT_ORIGIN: http://localhost:4173

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy client to Vercel
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Vercel builds the project itself, using the settings in vercel.json
      - name: Deploy
        run: npx vercel@latest deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
