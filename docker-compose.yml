# Runs the whole stack locally: Postgres, the API and the built client.
#
#   JWT_SECRET=$(openssl rand -hex 48) docker compose up --build
#
# Nothing in this file is a secret. Real credentials belong in the
# environment (or an untracked .env file next to this one), never in git.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: assettrackr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d assettrackr']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/assettrackr
      DATABASE_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random string of 32+ characters}
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  pgdata:
